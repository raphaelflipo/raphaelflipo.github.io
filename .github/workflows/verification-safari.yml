name: Toucher dans Safari iOS
on:
  push:
    branches: [verification-safari-v3]
permissions: {}
jobs:
  tactile:
    runs-on: macos-latest
    timeout-minutes: 16
    steps:
      - name: Construire le scénario de toucher
        run: |
          set -eu
          command -v xcodegen >/dev/null || brew install xcodegen
          mkdir -p Host Tests
          cat > Host/App.swift <<'SWIFT'
          import UIKit
          @main class App: UIResponder, UIApplicationDelegate { var window: UIWindow? }
          SWIFT
          cat > project.yml <<'SPEC'
          name: PublicSafari
          options:
            deploymentTarget:
              iOS: '17.0'
          settings:
            base:
              GENERATE_INFOPLIST_FILE: YES
              CODE_SIGNING_ALLOWED: NO
          targets:
            Host:
              type: application
              platform: iOS
              sources: [Host]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: local.receipt.host
            SafariTests:
              type: bundle.ui-testing
              platform: iOS
              sources: [Tests]
              dependencies:
                - target: Host
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: local.receipt.safaritests
                TEST_TARGET_NAME: Host
          schemes:
            Receipt:
              build:
                targets:
                  Host: all
                  SafariTests: [test]
              test:
                targets: [SafariTests]
          SPEC
          cat > Tests/SafariTouch.swift <<'SWIFT'
          import XCTest
          final class SafariTouch: XCTestCase {
              func testActivation() throws {
                  let safari = XCUIApplication(bundleIdentifier: "com.apple.mobilesafari")
                  safari.activate()
                  let web = safari.webViews.firstMatch
                  XCTAssertTrue(web.waitForExistence(timeout: 40), safari.debugDescription)
                  func dismissSafariTip() {
                      let close = safari.buttons.matching(identifier: "xmark.circle.fill").firstMatch
                      if close.exists && close.isHittable {
                          close.tap()
                          print("OS_SAFARI_TIP_DISMISSED")
                      }
                  }
                  dismissSafariTip()
                  let button = web.buttons["Activer la 3D"].firstMatch
                  XCTAssertTrue(button.waitForExistence(timeout: 45), safari.debugDescription)
                  for _ in 0..<12 {
                      dismissSafariTip()
                      if button.isHittable && button.frame.midY >= 120 && button.frame.midY <= safari.frame.height - 150 { break }
                      let start = safari.coordinate(withNormalizedOffset: CGVector(dx: 0.84, dy: 0.76))
                      let end = safari.coordinate(withNormalizedOffset: CGVector(dx: 0.84, dy: 0.38))
                      start.press(forDuration: 0.10, thenDragTo: end)
                  }
                  print("OS_BEFORE", button.frame, safari.frame, button.isHittable)
                  XCTAssertTrue(button.isHittable, safari.debugDescription)
                  button.tap()
                  let ready = web.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@ AND label CONTAINS[c] %@", "Sélection", "Beam wing")).firstMatch
                  let capture = web.buttons["Télécharger le PNG"].firstMatch
                  let enabled = XCTNSPredicateExpectation(predicate: NSPredicate(format: "enabled == true"), object: capture)
                  XCTAssertEqual(XCTWaiter.wait(for: [enabled], timeout: 65), .completed, safari.debugDescription)
                  XCTAssertTrue(ready.exists || !button.exists, safari.debugDescription)
                  print("OS_TOUCH_OK", capture.label, capture.isEnabled, ready.exists ? ready.label : "active stage", safari.frame)
              }
          }
          SWIFT
          xcodegen generate
      - name: Appuyer sur le bouton public dans MobileSafari
        run: |
          set -eu
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(v["udid"] for k in reversed(list(d)) if "iOS" in k for v in d[k] if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
          xcrun simctl list devices available | grep -F "$id"
          xcrun simctl openurl "$id" 'https://raphaelflipo.github.io/mercedes-w16/composants/?piece=beamWing'
          xcodebuild -project PublicSafari.xcodeproj -scheme Receipt -destination "platform=iOS Simulator,id=$id" -parallel-testing-enabled NO -derivedDataPath /tmp/SafariTouch CODE_SIGNING_ALLOWED=NO test

