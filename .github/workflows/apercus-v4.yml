name: Aperçus du portfolio V4
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Comparer les pages sur mobile et sur ordinateur
        run: |
          git worktree add --detach /tmp/portfolio-avant "${{ github.event.pull_request.base.sha }}"
          python3 -m http.server 8793 --bind 127.0.0.1 --directory /tmp/portfolio-avant &
          python3 -m http.server 8794 --bind 127.0.0.1 &
          git clone https://github.com/raphaelflipo/la-boussole.git /tmp/boussole-v41
          git -C /tmp/boussole-v41 checkout --detach 23d2b6a38382c4ac489ea1acfb496e893ec9a685
          git -C /tmp/boussole-v41 worktree add --detach /tmp/boussole-v4 8cc1f4f6d36f44d8ff780161c090f7bccf2d0840
          python3 -m http.server 8795 --bind 127.0.0.1 --directory /tmp/boussole-v4 &
          python3 -m http.server 8796 --bind 127.0.0.1 --directory /tmp/boussole-v41 &
          node scripts/recette-signature.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portfolio-v41-avant-apres
          path: signature-receipt/
