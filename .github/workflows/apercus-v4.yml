name: Aperçus du portfolio V4
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Comparer les versions livrées
        run: |
          git worktree add --detach /tmp/portfolio-avant 771f16e8c29a21b5e9434bce6cecdae11bd13fb9
          git clone https://github.com/raphaelflipo/la-boussole.git /tmp/boussole-apres
          git -C /tmp/boussole-apres checkout --detach 8cc1f4f6d36f44d8ff780161c090f7bccf2d0840
          git -C /tmp/boussole-apres worktree add --detach /tmp/boussole-avant 8f614c8
          node scripts/apercus-v4.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portfolio-v4-captures-completes
          path: work/captures/
